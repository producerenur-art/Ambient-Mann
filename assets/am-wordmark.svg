<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
<title>Ambient Mann — Podcast Series</title>
<defs><style>
 .br{animation:br 12s ease-in-out infinite}@keyframes br{0%,100%{opacity:.26}50%{opacity:.66}}
 .gl{animation:gl 9s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.16}50%{opacity:.38}}
 .rip{animation:rp 18s ease-in-out infinite alternate}@keyframes rp{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
 text{font-family:'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300}
</style>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#cfe2fa"/>
 <stop offset="1" stop-color="#8fb0dd"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#63c8e0" stop-opacity=".30"/>
 <stop offset="1" stop-color="#4d7fd0" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="fm"><rect x="0" y="162" width="800" height="78" fill="url(#fade)"/></mask>
<filter id="b5"><feGaussianBlur stdDeviation="5"/></filter>
<g id="ord">
 <text x="400" y="100" text-anchor="middle" font-size="58" letter-spacing="15">AMBIENT MANN</text>
 <text x="400" y="148" text-anchor="middle" font-size="25" letter-spacing="11">Podcast Series</text>
</g>
</defs>

<ellipse class="br" cx="400" cy="106" rx="340" ry="86" fill="url(#halo)"/>

<!-- glød bak, så bokstavene løfter seg fra stjernehimmelen -->
<use href="#ord" class="gl" fill="#8fdce8" filter="url(#b5)"/>
<!-- selve overskriften: nesten gjennomsiktig fyll + lysende kant = bakgrunnen skinner gjennom -->
<use href="#ord" fill="url(#silver)" fill-opacity=".16"
     stroke="url(#silver)" stroke-width="1.1" stroke-opacity=".95"/>

<!-- speiling i vannet -->
<g mask="url(#fm)" class="rip"><g transform="translate(0,318) scale(1,-1)" opacity=".45" filter="url(#b5)">
 <use href="#ord" fill="#bcdcff" fill-opacity=".35" stroke="#bcdcff" stroke-width="1" stroke-opacity=".6"/>
</g></g>
</svg>
