<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
<title>Ambient Mann</title>
<defs><style>
 .br{animation:br 12s ease-in-out infinite}@keyframes br{0%,100%{opacity:.28}50%{opacity:.7}}
 .gl{animation:gl 9s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.18}50%{opacity:.4}}
 .rip{animation:rp 18s ease-in-out infinite alternate}@keyframes rp{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
</style>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#c9def8"/>
 <stop offset="1" stop-color="#7ba1d4"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#63c8e0" stop-opacity=".34"/>
 <stop offset="1" stop-color="#4d7fd0" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="fm"><rect x="0" y="118" width="800" height="60" fill="url(#fade)"/></mask>
<filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse class="br" cx="400" cy="98" rx="340" ry="76" fill="url(#halo)"/>
<text x="400" y="110" text-anchor="middle" fill="url(#silver)"
 font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif"
 font-size="58" font-weight="300" letter-spacing="15">AMBIENT MANN</text>
<text class="gl" x="400" y="110" text-anchor="middle" fill="#8fdce8" filter="url(#b4)"
 font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif"
 font-size="58" font-weight="300" letter-spacing="15">AMBIENT MANN</text>
<g mask="url(#fm)" class="rip"><g transform="translate(0,234) scale(1,-1)" opacity=".5" filter="url(#b4)">
 <text x="400" y="110" text-anchor="middle" fill="#bcdcff"
  font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif"
  font-size="58" font-weight="300" letter-spacing="15">AMBIENT MANN</text></g></g>
</svg>
