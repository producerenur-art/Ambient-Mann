<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"><title>Ambient Mann</title>
<defs><style>
 .au1{animation:a1 30s ease-in-out infinite alternate}@keyframes a1{from{transform:translate(-80px,14px)}to{transform:translate(80px,-18px)}}
 .au2{animation:a2 42s ease-in-out infinite alternate}@keyframes a2{from{transform:translate(70px,-10px)}to{transform:translate(-70px,20px)}}
 .br{animation:br 12s ease-in-out infinite}@keyframes br{0%,100%{opacity:.3}50%{opacity:.75}}
 .edge{animation:ed 8s ease-in-out infinite}@keyframes ed{0%,100%{opacity:.65}50%{opacity:1}}
 .s1{animation:tw 3.6s ease-in-out infinite}.s2{animation:tw 5.4s ease-in-out infinite 1.1s}
 .s3{animation:tw 4.4s ease-in-out infinite 2.3s}.s4{animation:tw 6.2s ease-in-out infinite .6s}
 @keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
 .rip{animation:rp 18s ease-in-out infinite alternate}@keyframes rp{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
</style>
<linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#0c1a36"/><stop offset=".5" stop-color="#15325f"/>
 <stop offset="1" stop-color="#081222"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#c9def8"/>
 <stop offset="1" stop-color="#7ba1d4"/></linearGradient>
<radialGradient id="aur1"><stop offset="0" stop-color="#5fe6cf" stop-opacity="1"/>
 <stop offset="1" stop-color="#5fe6cf" stop-opacity="0"/></radialGradient>
<radialGradient id="aur2"><stop offset="0" stop-color="#7ab4ff" stop-opacity=".95"/>
 <stop offset="1" stop-color="#7ab4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="aur3"><stop offset="0" stop-color="#b98cff" stop-opacity=".7"/>
 <stop offset="1" stop-color="#b98cff" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#63c8e0" stop-opacity=".38"/>
 <stop offset="1" stop-color="#4d7fd0" stop-opacity="0"/></radialGradient>
<filter id="b12"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="b14"><feGaussianBlur stdDeviation="14"/></filter>
<mask id="mono"><g fill="none" stroke-linejoin="miter" stroke-miterlimit="8" stroke="#fff"><path d="M165 344 L313 112 L461 344" stroke-width="48"/><path d="M225 250 L401 250" stroke-width="24" stroke-linecap="butt"/><path d="M456 344 L456 150 L546 262 L636 150 L636 344" stroke-width="48"/></g></mask>
<g id="mp"><g fill="none" stroke-linejoin="miter" stroke-miterlimit="8"><path d="M165 344 L313 112 L461 344" stroke-width="48"/><path d="M225 250 L401 250" stroke-width="24" stroke-linecap="butt"/><path d="M456 344 L456 150 L546 262 L636 150 L636 344" stroke-width="48"/></g></g>
</defs>

<ellipse class="br" cx="400" cy="230" rx="330" ry="210" fill="url(#halo)"/>

<g mask="url(#mono)">
 <rect x="140" y="40" width="520" height="330" fill="url(#deep)"/>
 <g class="au1" filter="url(#b12)">
  <ellipse cx="330" cy="168" rx="215" ry="34" fill="url(#aur1)" transform="rotate(-12 330 168)"/></g>
 <g class="au2" filter="url(#b12)">
  <ellipse cx="470" cy="270" rx="240" ry="30" fill="url(#aur2)" transform="rotate(9 470 270)"/></g>
 <g class="au1" filter="url(#b12)" opacity=".8">
  <ellipse cx="380" cy="112" rx="180" ry="22" fill="url(#aur3)" transform="rotate(-6 380 112)"/></g>
 <g fill="#fff">
  <circle class="s1" cx="236" cy="286" r="2.2"/><circle class="s2" cx="300" cy="150" r="1.8"/>
  <circle class="s3" cx="352" cy="220" r="2"/>  <circle class="s4" cx="470" cy="160" r="2.2"/>
  <circle class="s2" cx="536" cy="278" r="1.7"/><circle class="s1" cx="600" cy="196" r="2"/>
  <circle class="s3" cx="628" cy="316" r="1.6"/><circle class="s4" cx="208" cy="326" r="1.8"/>
  <circle class="s1" cx="452" cy="322" r="1.6"/><circle class="s3" cx="566" cy="128" r="1.8"/>
  <circle class="s2" cx="272" cy="212" r="1.5"/><circle class="s4" cx="612" cy="252" r="1.5"/>
 </g>
</g>

<use href="#mp" stroke="#7fc4ff" stroke-opacity=".42" filter="url(#b14)"/>
<use href="#mp" class="edge" stroke="url(#silver)" style="stroke-width:2.6"/>

<text x="400" y="444" text-anchor="middle" fill="url(#silver)" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="58" font-weight="300" letter-spacing="15">AMBIENT MANN</text>
<text x="400" y="444" text-anchor="middle" fill="#8fdce8" opacity=".26" filter="url(#b4)" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="58" font-weight="300" letter-spacing="15">AMBIENT MANN</text>
<g class="rip" opacity=".16" filter="url(#b4)" transform="translate(0,942) scale(1,-1)">
 <text x="400" y="444" text-anchor="middle" fill="#bcdcff" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="58" font-weight="300" letter-spacing="15">AMBIENT MANN</text>
</g>
</svg>